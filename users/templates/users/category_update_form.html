{% extends "basic.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Update Category</h2>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="slug-display">Slug</label>
                <input type="text" id="slug-display" value="{{ object.slug }}" disabled
                    style="background-color: var(--card-bg); color: var(--text-muted); cursor: not-allowed; opacity: 0.7;">
                <small class="help-text">The slug cannot be changed.</small>
            </div>
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                <small class="help-text">{{ field.help_text }}</small>
                {% endif %}
                {% if field.errors %}
                <div class="error-text">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary">Update Category</button>
            <a href="{% url 'profile' %}" class="btn-secondary"
                style="text-align: center; display: block; margin-top: 1rem;">Cancel</a>
        </form>
    </div>
</div>


{% endblock %}
