{% extends "basic.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Update Source</h2>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                <small class="help-text">{{ field.help_text }}</small>
                {% endif %}
                {% if field.errors %}
                <div class="error-text">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary">Update Source</button>
            <a href="{% url 'profile' %}" class="btn-secondary" style="text-align: center; display: block; margin-top: 1rem;">Cancel</a>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const sourceTypeSelect = document.getElementById('id_source_type');
        const paramsField = document.getElementById('id_params');

        if (sourceTypeSelect && paramsField) {
            // Find the parent form-group to hide the whole row
            const paramsGroup = paramsField.closest('.form-group');

            function toggleParamsField() {
                if (sourceTypeSelect.value === 'API') {
                    paramsGroup.style.display = 'flex';
                } else {
                    paramsGroup.style.display = 'none';
                }
            }

            // Initial check
            toggleParamsField();

            // Listen for changes
            sourceTypeSelect.addEventListener('change', toggleParamsField);
        }
    });
</script>

<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .auth-card {
        background-color: var(--surface-card, #ffffff);
        padding: 2.5rem;
        border-radius: var(--radius-md, 12px);
        width: 100%;
        max-width: 450px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--border-color, #e2e8f0);
    }

    .auth-card h2 {
        text-align: center;
        color: var(--text-primary);
        margin-top: 0;
        margin-bottom: 2rem;
        font-size: 1.75rem;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        font-weight: 500;
        color: var(--text-secondary, #475569);
        font-size: 0.95rem;
    }

    /* Target inputs generated by Django form */
    .form-group input:not([type="checkbox"]),
    .form-group select,
    .form-group textarea {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color, #cbd5e1);
        border-radius: var(--radius-sm, 6px);
        font-size: 1rem;
        transition: all 0.2s;
        background-color: var(--surface-ground, #f8fafc);
        width: 100%;
        box-sizing: border-box;
    }

    .form-group input:not([type="checkbox"]):focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--primary-color, #3b82f6);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        background-color: #fff;
    }
    
    .form-group input[type="checkbox"] {
        width: 1.2rem;
        height: 1.2rem;
        cursor: pointer;
    }

    .help-text {
        font-size: 0.85rem;
        color: var(--text-secondary);
        opacity: 0.8;
    }

    .error-text {
        color: var(--danger-color, #ef4444);
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }

    .btn-primary {
        background-color: var(--primary-color, #3b82f6);
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: var(--radius-sm, 6px);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        margin-top: 0.5rem;
    }

    .btn-primary:hover {
        background-color: var(--primary-color-dark, #2563eb);
    }

    .btn-primary:active {
        transform: translateY(1px);
    }

    .btn-secondary {
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 0.95rem;
        transition: color 0.2s;
    }

    .btn-secondary:hover {
        color: var(--text-primary);
        text-decoration: underline;
    }
</style>
{% endblock %}
