{% extends "basic.html" %}

{% block content %}
<style>
    .pending-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: var(--spacing-md);
    }

    .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-lg);
        padding: var(--spacing-xl);
        text-align: center;
        max-width: 500px;
        width: 100%;
        box-shadow: var(--shadow-lg);
        animation: fadeIn 0.8s ease-out;
    }

    .loader-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto var(--spacing-lg);
    }

    .orbital-loader {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid transparent;
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 1.5s linear infinite;
    }

    .orbital-loader::before {
        content: "";
        position: absolute;
        top: 5px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        border: 3px solid transparent;
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 2s linear infinite;
    }

    .orbital-loader::after {
        content: "";
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border: 3px solid transparent;
        border-top-color: var(--primary-hover);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .pending-title {
        color: var(--text-main);
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: var(--spacing-sm);
    }

    .pending-text {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: var(--spacing-md);
    }

    .shimmer-text {
        background: linear-gradient(90deg, var(--text-muted) 0%, var(--text-main) 50%, var(--text-muted) 100%);
        background-size: 200% auto;
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
        to {
            background-position: 200% center;
        }
    }
</style>

<div class="pending-wrapper">
    <div class="glass-card">
        <div class="loader-container">
            <div class="orbital-loader"></div>
        </div>
        <h1 class="pending-title">Curating Your Feed</h1>
        <p class="pending-text">
            We're currently gathering the latest articles from your sources.
            This usually takes just a few moments.
        </p>
        <p class="pending-text shimmer-text">
            Please wait while we merge your daily news...
        </p>
    </div>
</div>

<script>
    setTimeout(function() {
    window.location.href = "{% url 'home' %}";
    }, 5000);
</script>
{% endblock %}
