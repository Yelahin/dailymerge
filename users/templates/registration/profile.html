{% extends "basic.html" %}

{% block content %}
<div class="auth-container">
    <h2>Profile</h2>

    <div class="profile-details" style="text-align: center; margin-bottom: 2rem;">
        <p style="font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-primary);">
            <strong>Username:</strong> {{ user.username }}
        </p>
        <p style="font-size: 1.1rem; color: var(--text-secondary);">
            <strong>Email:</strong> {{ user.email|default:"Not provided" }}
        </p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
        <a href="{% url 'password_change' %}" class="btn-secondary"
            style="text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary);">Change
            password</a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                style="background: none; border: none; padding: 0; color: var(--danger-color, #ef4444); cursor: pointer; text-decoration: underline; font-size: 0.9rem;">Log
                Out</button>
        </form>
    </div>
</div>
{% endblock %}
