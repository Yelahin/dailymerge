<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Breaking news!">
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/CSS/variables.css' %}">
    <link rel="stylesheet" href="{% static 'core/CSS/style.css' %}">
    <title>News</title>
</head>

<body>
    <nav>
        <div class="nav-top">
            <div class="logo">
                <a href="/" style="font-weight: 800; font-size: 1.5rem; color: var(--primary-color);">DailyMerge</a>
            </div>
            <form class="search-form" action="">
                <input type="search" name="search_bar" placeholder="Search news..."
                    value="{{ request.GET.search_bar }}">
                <button class="search-button" type="submit">Search</button>
            </form>
            {% if request.user.is_authenticated %}
            <div class="user-menu">
                <span class="user-name">{{ user.username }} &#9662;</span>
                <div class="user-dropdown">
                    <a href="{% url 'profile' %}">Profile</a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Log Out</button>
                    </form>
                </div>
            </div>
            {% else %}
            <a href="{% url 'login' %}" style="font-weight: 500;">Log In</a>
            {% endif %}
        </div>
        <div class="nav-bottom">
            <div class="nav-links">
                {% for category in categories %}
                <a href="{% url 'filtered_news' category.slug %}"
                    class="{% if category.slug == request.resolver_match.kwargs.slug and not request.GET.search_bar %}active{% endif %}">
                    {{ category }}
                </a>
                {% endfor %}
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock content %}
    </main>
    <script src="{% static 'core/JS/interactions.js' %}"></script>
</body>

</html>
