<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Breaking news!">
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/CSS/variables.css' %}">
    <link rel="stylesheet" href="{% static 'core/CSS/style.css' %}">
    <title>News</title>
</head>

<body>
    <nav>
        <div class="nav-top">
            <div class="logo">
                <a href="/" style="font-weight: 800; font-size: 1.5rem; color: var(--primary-color);">DailyMerge</a>
            </div>
            <form action="">
                <input type="search" name="search-bar" placeholder="Search news...">
                <button type="submit">Search</button>
            </form>
        </div>
        <div class="nav-bottom">
            <div class="nav-links">
                {% load cache %}
                {% cache 600 categories request.resolver_match.kwargs.slug %}
                {% for category in categories %}
                <a href="{% url 'filtered_news' category.slug %}"
                   class="{% if category.slug == request.resolver_match.kwargs.slug %}active{% endif %}">
                    {{ category }}
                </a>
                {% endfor %}
                {% endcache %}
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock content %}
    </main>
    <script src="{% static 'core/JS/interactions.js' %}"></script>
</body>

</html>
